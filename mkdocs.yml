site_name: Jolt QED
site_description: Formal verification notes and project documentation for Jolt QED.
repo_url: https://github.com/abiswas3/jolt-qed/tree/main
repo_name: abiswas3/jolt-qed
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy

nav:
  - Home: index.md
  - Projects:
      - projects/index.md
      - Bytecode Expansion: projects/bytecode-expansion.md
      - Lookup Table Verification: projects/lookup-table-verification.md
      - Jolt ISA: projects/jolt-isa.md
  - Status: status.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
